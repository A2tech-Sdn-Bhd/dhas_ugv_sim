x-common-config: &common-config
  network_mode: host
  ipc: host
  environment:
    - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    - ROBOT_MODEL_NAME=${ROBOT_MODEL_NAME:-panther}
    - ROBOT_NAMESPACE=${ROBOT_NAMESPACE:-${ROBOT_MODEL_NAME:-panther}}
    - ROS_DISTRO=${ROS_DISTRO:-humble}
    - LIDAR_TOPIC=/${ROBOT_NAMESPACE:-${ROBOT_MODEL_NAME:-panther}}/lidar_3d/ouster/points
    - BASE_FRAME=${ROBOT_NAMESPACE:-${ROBOT_MODEL_NAME:-panther}}/base_link
    - ODOM_FRAME=${ROBOT_NAMESPACE:-${ROBOT_MODEL_NAME:-panther}}/odom
    - SLAM_ODOM_TOPIC=/slam/odometry
    - SLAM_DB_PATH=/autoware_data/slam/rtabmap.db

x-cpu-config: &cpu-config
  env_file: .env.cpu
x-gpu-config: &gpu-config
  env_file: .env.gpu

services:
  slam_3d_lidar:
    image: ${SLAM_RUNTIME_IMAGE:-local/slam-3d-lidar:humble}
    build:
      context: .
      dockerfile: Dockerfile.slam.3d
      args:
        SLAM_BASE_IMAGE: ${SLAM_BASE_IMAGE:-husarion/husarion-ugv-gazebo:humble-2.2.2-20250702}
    container_name: slam_3d_lidar
    <<:
      - *common-config
      - *gpu-config
    command: >
      bash -lc "${SLAM_START_CMD:-sleep infinity}"
    volumes:
      - ./autoware_data:/autoware_data:rw
    restart: unless-stopped
